name: Desktop Windows foundation
on:
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", "src/backend/**", "src/frontend/**", ".github/workflows/desktop-windows.yml", ".github/workflows/scripts/**"]
permissions: { contents: read }
jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: "**/package-lock.json" }
      - run: python -m pip install -r src/backend/packaging/requirements-desktop.txt -r src/backend/packaging/requirements-test.txt
      - run: python -m pytest -q
        working-directory: src/backend
      - run: npm ci
        working-directory: src/frontend
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: src/frontend
      - run: node scripts/generate-csp-manifest.js
        working-directory: desktop
      - run: ./packaging/build-sidecar.ps1
        working-directory: src/backend
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Commercial preflight must fail closed without production trust inputs
        shell: pwsh
        run: |
          $env:GROWTHMAP_COMMERCIAL_RELEASE='1'
          npm run preflight:win
          if ($LASTEXITCODE -eq 0) { throw 'Commercial preflight unexpectedly passed without legal/key/endpoints/code signing' }
          exit 0
        working-directory: desktop
      - name: Build isolated non-shipped E2E package
        run: npm run dist:win:e2e
        working-directory: desktop
      - name: Full packaged database/lifecycle E2E
        timeout-minutes: 5
        run: npm run renderer:e2e
        working-directory: desktop
        env:
          CI: 'true'
          GROWTHMAP_E2E_SCREENSHOT: ${{ github.workspace }}/desktop/artifacts/growthmap-renderer.png
      - name: Delete entire isolated test dist
        shell: pwsh
        run: Remove-Item desktop/dist -Recurse -Force
      - name: Assert E2E bypass names are absent from commercial source set
        shell: pwsh
        run: |
          $pkg = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          if (-not ($pkg.build.files -contains '!e2e-main.js')) { throw 'E2E main exclusion missing' }
          foreach ($forbidden in @('e2e-main.js','e2e-commercial-config.js')) { if ($pkg.build.files -contains $forbidden) { throw "E2E source ships in production file set: $forbidden" } }
          if ($pkg.build.extraResources.from -match '(^|[\/])e2e([\/]|$)') { throw 'E2E resource ships in production resource set' }
      - name: Build final noncommercial unsigned NSIS test installer
        run: npm run dist:win
        working-directory: desktop
      - name: Verify final production resources and normal sidecar smoke
        shell: pwsh
        run: ./.github/workflows/scripts/verify-windows-package.ps1
      - name: Windows adversarial database boundaries and crash recovery
        shell: pwsh
        run: ./.github/workflows/scripts/test-windows-database-boundaries.ps1
      - name: Verify final production ASAR excludes all E2E material
        shell: pwsh
        run: ./.github/workflows/scripts/verify-production-asar.ps1
      - name: Commercial Authenticode and updater metadata verification (publication gate)
        if: ${{ env.GROWTHMAP_COMMERCIAL_RELEASE == '1' }}
        shell: pwsh
        run: |
          $identity = Get-Content desktop/product-identity.json -Raw | ConvertFrom-Json
          $installer = Get-ChildItem desktop/dist/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $installer.FullName
          if ($identity.status -ne 'APPROVED' -or $sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -ne $identity.windowsPublisher) { throw 'Authenticode signer/status mismatch' }
          if (-not $sig.TimeStamperCertificate -or -not $sig.SignerCertificate.Verify()) { throw 'Authenticode timestamp/chain verification failed' }
          $metadata = Get-ChildItem desktop/dist/latest*.yml | Select-Object -First 1
          if (-not $metadata -or -not (Select-String -Path $metadata.FullName -Pattern '^sha512:' -Quiet)) { throw 'Updater metadata/hash missing' }
      - name: Assert NSIS artifact exists and write SHA-256
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/dist -Filter 'GrowthMap-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer artifact missing' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii
          Write-Host "Built noncommercial unsigned test installer: $($installer.FullName)"
          Write-Host "SHA-256: $hash"
      - name: Upload noncommercial unsigned Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: growthmap-windows-noncommercial-unsigned-${{ github.sha }}
          path: |
            desktop/dist/GrowthMap-Setup-*.exe
            desktop/dist/GrowthMap-Setup-*.exe.sha256
            desktop/artifacts/growthmap-renderer.png
          if-no-files-found: error
          retention-days: 14
