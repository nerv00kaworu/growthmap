name: Desktop Windows foundation
on:
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", "src/backend/**", "src/frontend/**", "services/payments/**", "config/**", "tools/generate-public-config.py", ".github/workflows/desktop-windows.yml", ".github/workflows/scripts/**"]
permissions: { contents: read }
jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22", cache: npm, cache-dependency-path: "**/package-lock.json" }
      # Install unhashed desktop/backend inputs separately from the
      # hash-enforced payments lock. Combining them makes pip apply
      # require-hashes to every file and reject the intentionally ranged
      # desktop requirements before any test or packaging step can run.
      - run: python -m pip install -r src/backend/packaging/requirements-desktop.txt -r src/backend/packaging/requirements-test.txt
      - run: python -m pip install -r services/payments/requirements.lock
      - run: python tools/generate-public-config.py --check
      - run: python -m compileall -q services/payments/growthmap_payments tools
      # The ops harness intentionally depends on POSIX dirfd/O_NOFOLLOW semantics
      # and is exercised in full by ci.yml on Linux. Windows still runs every
      # cross-platform payment/desktop contract, including Gift HTTP E2E.
      - name: Cross-platform payment contracts (exclude POSIX-only ops harness)
        run: python -m pytest -q services/payments/tests --ignore=services/payments/tests/test_ops_harness.py
        env:
          PYTHONPATH: services/payments;src/backend
      - name: POSIX ops harness remains covered by the Linux CI gate
        shell: pwsh
        run: |
          if (-not (Select-String -Path .github/workflows/ci.yml -Pattern 'python3 -m pytest -q services/payments/tests' -Quiet)) { throw 'Linux full payment gate is missing' }
          if (-not (Test-Path services/payments/tests/test_ops_harness.py -PathType Leaf)) { throw 'POSIX ops harness source is missing' }
          if (-not (Select-String -Path services/payments/growthmap_payments/ops.py -Pattern 'O_DIRECTORY' -Quiet)) { throw 'POSIX ops boundary marker is missing' }
      - name: Linux-only production sidecar source contract remains present
        shell: pwsh
        run: |
          foreach ($path in @('services/payments/growthmap_payments/unix_transport.py','services/payments/growthmap_payments/sidecar_server.py')) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing Linux production sidecar source: $path" }
          }
          if (-not (Select-String -Path services/payments/tests/test_sidecar_server.py -Pattern 'AF_UNIX/SO_PEERCRED' -Quiet)) { throw 'Windows skip must document Linux AF_UNIX/SO_PEERCRED boundary' }
      # Production Authority custody and deployment rails require fcntl, dirfd,
      # /proc, Unix ownership/modes, bash and systemd. Ubuntu CI runs the full
      # unfiltered backend suite; Windows keeps every cross-platform sidecar test.
      - name: Declare job-owned Windows backend database root
        shell: pwsh
        run: |
          $nonce = [Guid]::NewGuid().ToString('N')
          # Hosted runner D: work/temp volumes can reject Set-Acl even though the
          # same policy is supported on the current user's local NTFS profile.
          $privateBase = Join-Path $env:LOCALAPPDATA 'Temp'
          if (-not $env:LOCALAPPDATA -or -not (Test-Path -LiteralPath $privateBase -PathType Container)) { throw 'Current-user Windows local temp root is unavailable' }
          $root = Join-Path $privateBase ("growthmap-backend-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$nonce")
          $marker = "$root.owner"
          if ((Test-Path -LiteralPath $root) -or (Test-Path -LiteralPath $marker)) { throw "Windows backend ownership paths already exist" }
          "GROWTHMAP_WINDOWS_BACKEND_ROOT=$root" >> $env:GITHUB_ENV
          "GROWTHMAP_WINDOWS_BACKEND_MARKER=$marker" >> $env:GITHUB_ENV
          "GROWTHMAP_WINDOWS_BACKEND_PROOF=$env:GITHUB_RUN_ID/$env:GITHUB_RUN_ATTEMPT/$nonce/$root" >> $env:GITHUB_ENV
          "GROWTHMAP_WINDOWS_DATABASE_URL=sqlite+aiosqlite:///$($root -replace '\\','/')/windows-ci-test.db" >> $env:GITHUB_ENV
      - name: Create job-owned private Windows backend database root
        shell: pwsh
        run: |
          New-Item -ItemType File -Path $env:GROWTHMAP_WINDOWS_BACKEND_MARKER -Value $env:GROWTHMAP_WINDOWS_BACKEND_PROOF | Out-Null
          New-Item -ItemType Directory -Path $env:GROWTHMAP_WINDOWS_BACKEND_ROOT | Out-Null
          $env:PYTHONPATH = 'src/backend'
          python -c "from pathlib import Path; from api.windows_file_security import apply_private,verify; p=Path(r'$env:GROWTHMAP_WINDOWS_BACKEND_ROOT'); apply_private(p); verify(p,kind='dir')"
      - name: Native Windows provider-lock and inbox PowerShell-chain gate
        shell: pwsh
        run: |
          $fixture = Join-Path $env:LOCALAPPDATA ("Temp\growthmap-provider-lock-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$([Guid]::NewGuid().ToString('N'))")
          try {
            $env:GM_LOCK_FIXTURE = $fixture
            python src/backend/tests/windows_provider_lock_harness.py
          } finally {
            if (Test-Path -LiteralPath $fixture) { Remove-Item -LiteralPath $fixture -Recurse -Force }
          }
      - name: Cross-platform backend contracts (exclude POSIX custody and deployment rails)
        run: python -m pytest -q --ignore=tests/test_authority_composition.py --ignore=tests/test_authority_service.py --ignore=tests/test_pem_signer_hardening.py --ignore=tests/test_r14_deployment_contract.py --ignore=tests/test_r15_deployment_contract.py --ignore=tests/test_r16_deployment_contract.py --ignore=tests/test_r17_deployment_contract.py --ignore=tests/test_r18_deployment_contract.py --ignore=tests/test_r19_deployment_contract.py --ignore=tests/test_r20_deployment_contract.py --ignore=tests/test_r21_deployment_contract.py --ignore=tests/test_r22_deployment_contract.py --ignore=tests/test_r23_deployment_contract.py --ignore=tests/test_r24_deployment_contract.py --ignore=tests/test_security_remediation.py
        working-directory: src/backend
        env:
          PYTHONPATH: ../..
          DATABASE_URL: ${{ env.GROWTHMAP_WINDOWS_DATABASE_URL }}
      - name: Delete job-owned private Windows backend database root
        if: always()
        shell: pwsh
        run: |
          $root = $env:GROWTHMAP_WINDOWS_BACKEND_ROOT
          $marker = $env:GROWTHMAP_WINDOWS_BACKEND_MARKER
          $owned = $marker -and (Test-Path -LiteralPath $marker -PathType Leaf) -and ((Get-Content -LiteralPath $marker -Raw).Trim() -eq $env:GROWTHMAP_WINDOWS_BACKEND_PROOF)
          if ($owned) {
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
            Remove-Item -LiteralPath $marker -Force
          }
          if ($root -and ((Test-Path -LiteralPath $root) -or (Test-Path -LiteralPath $marker))) {
            throw "Windows backend private-root cleanup left residual state: $root"
          }
      - name: POSIX backend rails remain covered by the Linux full-suite gate
        shell: pwsh
        run: |
          $ci = Get-Content .github/workflows/ci.yml -Raw
          if ($ci -notmatch 'runs-on: ubuntu-latest' -or $ci -notmatch 'working-directory: src/backend' -or $ci -notmatch 'python -m pytest -q') { throw 'Linux full backend gate is missing' }
          if ($ci -notmatch 'DATABASE_URL: "sqlite\+aiosqlite:///\./ci-test\.db"') { throw 'Linux backend database contract is missing' }
          foreach ($path in @('src/backend/tests/test_authority_composition.py','src/backend/tests/test_authority_service.py','src/backend/tests/test_pem_signer_hardening.py','src/backend/tests/test_r14_deployment_contract.py','src/backend/tests/test_r24_deployment_contract.py','src/backend/tests/test_security_remediation.py')) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Linux-routed backend test source is missing: $path" }
          }
          if (-not (Select-String -Path src/backend/licensing/authority_service.py -Pattern '^import fcntl' -Quiet)) { throw 'POSIX Authority custody marker is missing' }
      - run: npm ci
        working-directory: src/frontend
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: src/frontend
      - name: Tracked CSP semantic content identity must match the fresh deterministic build
        shell: pwsh
        run: |
          node desktop/scripts/verify-csp-manifest.js --tracked-git HEAD:desktop/generated/csp-script-hashes.json --generated desktop/generated/csp-script-hashes.json
          $cspStatus = $LASTEXITCODE
          if ($cspStatus -ne 0) {
            node desktop/scripts/diagnose-csp-manifest.js --tracked-git HEAD:desktop/generated/csp-script-hashes.json --generated desktop/generated/csp-script-hashes.json --out src/frontend/out
            $diagnosticStatus = $LASTEXITCODE
            if ($diagnosticStatus -ne 0) { Write-Host "::error::CSP diagnostic failed closed with status $diagnosticStatus" }
            exit $cspStatus
          }
          exit 0
      - run: ./packaging/build-sidecar.ps1
        working-directory: src/backend
      - run: ./packaging/build-mcp.ps1
        working-directory: src/backend
      - name: Genuine Windows MCP discovery, Credential Manager, restart, revoke, reparse and leak integration
        shell: pwsh
        run: ./.github/workflows/scripts/test-windows-mcp.ps1 -McpExe src/backend/dist/growthmap-mcp.exe
      - run: npm ci
        working-directory: desktop
      - name: Freeze clean desktop dependency provenance before scripts/build
        id: dependency-provenance
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP ("growthmap-node-provenance-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json")
          $digest = ./.github/workflows/scripts/new-node-provenance.ps1 -NodeModules desktop/node_modules -LockPath desktop/package-lock.json -PackagePath desktop/package.json -OutputPath $path
          "path=$path" >> $env:GITHUB_OUTPUT
          "sha256=$digest" >> $env:GITHUB_OUTPUT
          # ACL blocks later non-admin processes from replacing this job-external file;
          # the separately captured digest detects modification by same-user build steps.
          icacls $path /inheritance:r /grant:r "$env:USERNAME`:(R)" /grant:r "SYSTEM`:(F)" | Out-Null
      - run: npm test
        working-directory: desktop
      - name: Commercial preflight must fail closed without production trust inputs
        shell: pwsh
        run: |
          $env:GROWTHMAP_COMMERCIAL_RELEASE='1'
          npm run preflight:win
          if ($LASTEXITCODE -eq 0) { throw 'Commercial preflight unexpectedly passed without legal/key/endpoints/code signing' }
          exit 0
        working-directory: desktop
      - name: Build isolated non-shipped E2E package
        run: npm run dist:win:e2e
        working-directory: desktop
      - name: Full packaged database/lifecycle E2E
        timeout-minutes: 5
        run: npm run renderer:e2e
        working-directory: desktop
        env:
          CI: 'true'
          GROWTHMAP_E2E_SCREENSHOT: ${{ github.workspace }}/desktop/artifacts/growthmap-renderer.png
      - name: Delete entire isolated test dist
        shell: pwsh
        run: Remove-Item desktop/dist -Recurse -Force
      - name: Assert E2E bypass names are absent from commercial source set
        shell: pwsh
        run: |
          $pkg = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          if (-not ($pkg.build.files -contains '!e2e-main.js')) { throw 'E2E main exclusion missing' }
          foreach ($forbidden in @('e2e-main.js','e2e-commercial-config.js')) { if ($pkg.build.files -contains $forbidden) { throw "E2E source ships in production file set: $forbidden" } }
          if ($pkg.build.extraResources.from -match '(^|[\/])e2e([\/]|$)') { throw 'E2E resource ships in production resource set' }
      # Owner-choice manual test artifact only: Windows will show "Unknown Publisher".
      # This path is not a commercial release and must never set GROWTHMAP_COMMERCIAL_RELEASE=1.
      - name: Build final noncommercial unsigned NSIS test installer (Unknown Publisher, updater disabled)
        run: npm run dist:win
        working-directory: desktop
        env:
          GROWTHMAP_COMMERCIAL_RELEASE: ''
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
      - name: Verify unsigned manual-release mode metadata
        shell: pwsh
        run: |
          $mode = Get-Content desktop/release-mode.json -Raw | ConvertFrom-Json
          if ($mode.mode -ne 'unsigned-manual' -or $mode.updatesEnabled -ne $false -or $mode.publisherDisplay -ne 'Unknown Publisher') { throw 'Unsigned release metadata must disable updater and identify Unknown Publisher' }
          if ($env:GROWTHMAP_COMMERCIAL_RELEASE -or $env:WIN_CSC_LINK -or $env:WIN_CSC_KEY_PASSWORD) { throw 'Unsigned workflow leaked commercial/signing environment' }
      - name: Launch final unsigned package with real production main
        shell: pwsh
        run: |
          $exe = Resolve-Path desktop/dist/win-unpacked/GrowthMap.exe
          $profile = Join-Path $env:LOCALAPPDATA "growthmap-final-main-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path $profile) { throw 'Final package smoke profile already exists' }
          New-Item $profile -ItemType Directory | Out-Null
          $legacyDb = Join-Path $profile 'growthmap.db'
          @'
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1]);c.executescript("""CREATE TABLE projects(id TEXT PRIMARY KEY,name TEXT,description TEXT,goal TEXT,root_node_id TEXT,status TEXT,settings JSON,created_at DATETIME,updated_at DATETIME);CREATE TABLE nodes(id TEXT PRIMARY KEY,project_id TEXT,branch_id TEXT,title TEXT,summary TEXT,node_type TEXT,status TEXT,maturity TEXT,priority INTEGER,confidence FLOAT,description TEXT,rules_text TEXT,constraints_text TEXT,examples_text TEXT,questions_text TEXT,decision_notes TEXT,tags JSON,created_by TEXT,last_edited_by TEXT,position_x FLOAT,position_y FLOAT,workflow_status TEXT,file_paths JSON,created_at DATETIME,updated_at DATETIME);CREATE TABLE edges(id TEXT PRIMARY KEY,project_id TEXT,from_node_id TEXT,to_node_id TEXT,relation_type TEXT,weight FLOAT,note TEXT,is_mainline BOOLEAN,created_at DATETIME);CREATE TABLE content_blocks(id TEXT PRIMARY KEY,node_id TEXT,block_type TEXT,content JSON,order_index INTEGER,created_by TEXT,created_at DATETIME,updated_at DATETIME);CREATE TABLE branches(id TEXT PRIMARY KEY,project_id TEXT,name TEXT,description TEXT,source_node_id TEXT,status TEXT,created_at DATETIME);CREATE TABLE action_logs(id TEXT PRIMARY KEY,project_id TEXT,actor_type TEXT,action_type TEXT,created_at DATETIME);CREATE TABLE provider_configs(id TEXT PRIMARY KEY,name TEXT,provider_type TEXT,model_name TEXT,enabled INTEGER);""")
          for i in range(6):
           p=f'p{i}';r=f'r{i}';c.execute("INSERT INTO projects VALUES(?,?,?,?,?,?,?,?,?)",(p,f'Legacy Project {i}','', '',r,'active','{}','2020-01-01','2020-01-01'));c.execute("INSERT INTO nodes VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",(r,p,None,f'Root {i}','', 'concept','active','seed',0,.5,'','','','','','','[]','human','human',0,0,'draft','[]','2020-01-01','2020-01-01'))
          c.commit()
          '@ | python - $legacyDb
          $beforeHash = (Get-FileHash $legacyDb -Algorithm SHA256).Hash
          $beforeTime = (Get-Item $legacyDb).LastWriteTimeUtc
          $beforeSize = (Get-Item $legacyDb).Length
          $out = Join-Path $env:RUNNER_TEMP 'growthmap-final-main.stdout.log'
          $err = Join-Path $env:RUNNER_TEMP 'growthmap-final-main.stderr.log'
          $process = Start-Process $exe -ArgumentList "--user-data-dir=$profile" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            $ready = $false
            while ([DateTime]::UtcNow -lt $deadline -and -not $process.HasExited) {
              $sidecar = Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'growthmap-sidecar.exe' -and $_.ParentProcessId -eq $process.Id }
              if ($sidecar) {
                $renderer = Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $process.Id -and $_.CommandLine -match '--type=renderer' }
                if ($renderer) { $ready = $true; break }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              $stdout = if (Test-Path $out) { Get-Content $out -Raw } else { '' }
              $stderr = if (Test-Path $err) { Get-Content $err -Raw } else { '' }
              throw "Final unsigned package real main failed startup. exited=$($process.HasExited) stdout=$stdout stderr=$stderr"
            }
            Start-Sleep -Seconds 5
          }
          finally {
            taskkill /PID $process.Id /T /F 2>$null | Out-Null
            Wait-Process -Id $process.Id -Timeout 20 -ErrorAction SilentlyContinue
          }
          if ((Get-FileHash $legacyDb -Algorithm SHA256).Hash -ne $beforeHash -or (Get-Item $legacyDb).Length -ne $beforeSize -or (Get-Item $legacyDb).LastWriteTimeUtc -ne $beforeTime) { throw 'Read-only legacy DB changed during final package UI smoke' }
          $stderr = if (Test-Path $err) { Get-Content $err -Raw } else { '' }
          if ($stderr -match 'Internal Server Error|no such column|OperationalError') { throw "Final package could not render legacy DB data: $stderr" }
          Remove-Item $profile -Recurse -Force
      - name: Verify final production resources and normal sidecar smoke
        shell: pwsh
        run: ./.github/workflows/scripts/verify-windows-package.ps1
      - name: Windows adversarial database boundaries and crash recovery
        shell: pwsh
        run: ./.github/workflows/scripts/test-windows-database-boundaries.ps1
      - name: Verify final production ASAR excludes all E2E material
        shell: pwsh
        run: ./.github/workflows/scripts/verify-production-asar.ps1 -ProvenancePath ${{ steps.dependency-provenance.outputs.path }} -ProvenanceSha256 ${{ steps.dependency-provenance.outputs.sha256 }}
      - name: Commercial Authenticode and updater metadata verification (publication gate)
        if: ${{ env.GROWTHMAP_COMMERCIAL_RELEASE == '1' }}
        shell: pwsh
        run: |
          $identity = Get-Content desktop/product-identity.json -Raw | ConvertFrom-Json
          $installer = Get-ChildItem desktop/dist/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $installer.FullName
          if ($identity.status -ne 'APPROVED' -or $sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -ne $identity.windowsPublisher) { throw 'Authenticode signer/status mismatch' }
          if (-not $sig.TimeStamperCertificate -or -not $sig.SignerCertificate.Verify()) { throw 'Authenticode timestamp/chain verification failed' }
          $metadata = Get-ChildItem desktop/dist/latest*.yml | Select-Object -First 1
          if (-not $metadata -or -not (Select-String -Path $metadata.FullName -Pattern '^sha512:' -Quiet)) { throw 'Updater metadata/hash missing' }
      - name: Assert NSIS artifact exists and write SHA-256
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/dist -Filter 'GrowthMap-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer artifact missing' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii
          Write-Host "Built noncommercial unsigned test installer: $($installer.FullName)"
          Write-Host "SHA-256: $hash"
      - name: Upload noncommercial unsigned Windows test installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: growthmap-windows-noncommercial-unsigned-${{ github.sha }}
          path: |
            desktop/dist/GrowthMap-Setup-*.exe
            desktop/dist/GrowthMap-Setup-*.exe.sha256
            desktop/artifacts/growthmap-renderer.png
          if-no-files-found: error
          retention-days: 14
