name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  public-config-payments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/payments/requirements.lock
      # The payments lock is hash-enforced and already includes its test runner.
      # Do not combine it with unhashed backend requirements: pip enables
      # require-hashes for the whole invocation when any input is hashed.
      - run: pip install -r services/payments/requirements.lock
      - run: pip install -r src/backend/packaging/requirements-test.txt
      - run: python3 tools/generate-public-config.py --check
      - run: python3 -m compileall -q services/payments/growthmap_payments tools
      - run: PYTHONPATH=services/payments:src/backend python3 -m pytest -q services/payments/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:deterministic-build
      - run: git diff --exit-code -- desktop/generated/csp-script-hashes.json

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    env:
      # Concurrent AsyncSessions must use independent SQLite connections.
      # A shared :memory: connection lets one loser's rollback corrupt the
      # winning branch transaction in the CAS race tests.
      DATABASE_URL: "sqlite+aiosqlite:///./ci-test.db"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.lock
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock -r packaging/requirements-test.txt
      - run: python -m compileall -q -x 'venv|__pycache__' .
      - run: python -m pytest -q
      - run: |
          test ! -e gameplay
          test ! -e content
          test ! -e domain
          test ! -e assets
          test ! -e idempotency.py
