name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  public-config-payments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/payments/requirements.lock
      # The payments lock is hash-enforced and already includes its test runner.
      # Do not combine it with unhashed backend requirements: pip enables
      # require-hashes for the whole invocation when any input is hashed.
      - run: pip install -r services/payments/requirements.lock
      - run: pip install -r src/backend/packaging/requirements-test.txt
      - run: python3 tools/generate-public-config.py --check
      - run: python3 -m compileall -q services/payments/growthmap_payments tools
      - run: PYTHONPATH=services/payments:src/backend python3 -m pytest -q services/payments/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:deterministic-build
      - run: git diff --exit-code -- desktop/generated/csp-script-hashes.json

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    env:
      # Concurrent AsyncSessions must use independent SQLite connections.
      # A shared :memory: connection lets one loser's rollback corrupt the
      # winning branch transaction in the CAS race tests.
      DATABASE_URL: "sqlite+aiosqlite:///./ci-test.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.lock
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock -r packaging/requirements-test.txt
      - run: python -m compileall -q -x 'venv|__pycache__' .
      # R14-R24 deployment contracts consume an external, untracked VPS evidence
      # bundle. Keep that dedicated-runner boundary explicit and fail closed if
      # the files or their artifact contracts drift; every other backend test runs.
      - name: Verify artifact-bound deployment-test partition
        run: |
          set -eu
          ignores=""
          for release in $(seq 14 24); do
            test_file="tests/test_r${release}_deployment_contract.py"
            artifact="reports/phase2-authority-production-readiness-20260808/vps-staging-r${release}"
            test -f "$test_file"
            grep -Fq "$artifact" "$test_file"
            ignores="$ignores --ignore=$test_file"
          done
          discovered=$(find tests -maxdepth 1 -name 'test_r*_deployment_contract.py' -print)
          test "$(printf '%s\n' "$discovered" | grep -c .)" -eq 11
          if printf '%s\n' "$discovered" | grep -Evq '^tests/test_r(1[4-9]|2[0-4])_deployment_contract\.py$'; then
            echo 'Unexpected deployment contract is not explicitly partitioned' >&2
            exit 1
          fi
          python -m pytest -q $ignores
      - run: |
          test ! -e gameplay
          test ! -e content
          test ! -e domain
          test ! -e assets
          test ! -e idempotency.py
