name: GrowthMap Windows Production Personal v1 (unsigned)
on:
  workflow_dispatch:
    inputs:
      release_label:
        description: Human artifact label (no version mutation; source package.json remains authoritative)
        required: true
        default: personal-v1-rc1
        type: string
      g1_public_key_sha256:
        description: Witnessed lowercase SHA-256 of the exact production G1 public PEM bytes
        required: true
        type: string
permissions: { contents: read }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm, cache-dependency-path: '**/package-lock.json' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12', cache: pip }
      - name: Verify exact R39 candidate source metadata and integrity
        run: node release/verify-windows-r39-candidate.cjs
      - name: Validate manual unsigned release inputs
        shell: pwsh
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
          G1_PIN: ${{ inputs.g1_public_key_sha256 }}
          G1_PEM_BASE64: ${{ secrets.GROWTHMAP_G1_PUBLIC_KEY_PEM_BASE64 }}
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_SHA -ne (git rev-parse HEAD)) { throw 'Exact intentionally pushed source is required' }
          if ($env:RELEASE_LABEL -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$') { throw 'Release label must be a safe 1-64 character artifact label' }
          if ($env:G1_PIN -cnotmatch '^[0-9a-f]{64}$') { throw 'Witnessed lowercase G1 SHA-256 is required' }
          if ([string]::IsNullOrWhiteSpace($env:G1_PEM_BASE64)) { throw 'GROWTHMAP_G1_PUBLIC_KEY_PEM_BASE64 secret is required' }
      - run: python -m pip install -r src/backend/packaging/requirements-desktop.txt -r src/backend/packaging/requirements-test.txt
      - name: Verify signed activation certificate imports into Windows desktop state
        run: python -m pytest -q src/backend/tests/test_commercial_entitlements.py
        env:
          PYTHONPATH: src/backend
      - name: Run focused product provider-selection authority tests
        shell: pwsh
        env:
          PYTHONPATH: src/backend
        run: |
          $db=(Join-Path $env:RUNNER_TEMP 'growthmap-provider-selection-product.db')
          $env:DATABASE_URL=('sqlite+aiosqlite:///' + ($db -replace '\\','/'))
          python -m pytest -q src/backend/tests/test_provider_selection_authority.py
          python -m unittest -v src/backend/tests/test_provider_selection_authority_stdlib.py
      - run: npm ci
        working-directory: src/frontend
      - run: npm audit --audit-level=low
        working-directory: src/frontend
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: src/frontend
      - run: ./packaging/build-sidecar.ps1
        working-directory: src/backend
      - run: ./packaging/build-mcp.ps1
        working-directory: src/backend
      - run: npm ci
        working-directory: desktop
      - run: npm audit --audit-level=low
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Windows replacement fail-closed policy acceptance
        shell: pwsh
        timeout-minutes: 5
        working-directory: desktop
        run: |
          $ErrorActionPreference = 'Stop'
          node --test tests/windows-native-broker.test.js tests/windows-native-evidence.test.js tests/windows-native-replacement.test.js tests/windows-startup-recovery.test.js tests/database-manager-windows-preflight.test.js
          if ($LASTEXITCODE -ne 0) { throw "Windows replacement fail-closed policy acceptance failed with exit $LASTEXITCODE" }
      - name: Build isolated non-shipped R39 E2E package
        timeout-minutes: 10
        run: npm run dist:win:e2e
        working-directory: desktop
      - name: R39 packaged renderer and real-main lifecycle E2E
        timeout-minutes: 8
        run: npm run renderer:e2e 2>&1 | Tee-Object -FilePath artifacts/r39-renderer-e2e.log
        shell: pwsh
        working-directory: desktop
        env:
          CI: 'true'
          GROWTHMAP_E2E_SCREENSHOT: ${{ github.workspace }}/desktop/artifacts/growthmap-r39-renderer.png
      - name: Delete isolated E2E package before production packaging
        if: always()
        shell: pwsh
        run: if (Test-Path desktop/dist) { Remove-Item desktop/dist -Recurse -Force }
      - name: Assert production ASAR source set excludes E2E entrypoints
        shell: pwsh
        run: |
          $pkg = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          if (-not ($pkg.build.files -contains '!e2e-main.js')) { throw 'E2E main exclusion missing' }
          foreach ($forbidden in @('e2e-main.js','e2e-commercial-config.js')) { if ($pkg.build.files -contains $forbidden) { throw "E2E source ships in production file set: $forbidden" } }
      - name: Verify deterministic CSP generated bytes against committed HEAD
        shell: pwsh
        run: |
          $expected = (git rev-parse 'HEAD:desktop/generated/csp-script-hashes.json').Trim()
          if ($LASTEXITCODE -ne 0 -or $expected -notmatch '^[0-9a-f]{40,64}$') { throw 'Committed CSP blob unavailable' }
          $actual = (git hash-object -- desktop/generated/csp-script-hashes.json).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) { throw 'Generated CSP raw bytes differ from committed HEAD' }
      - name: Remove bounded test diagnostics before final integrity gate
        shell: pwsh
        run: if (Test-Path desktop/artifacts) { Remove-Item desktop/artifacts -Recurse -Force }
      - name: Final clean committed R39 integrity verification before secrets and package
        run: node release/verify-windows-r39-candidate.cjs
      - name: Materialize exact public G1 PEM outside source tree
        id: public-config
        shell: pwsh
        env:
          G1_PIN: ${{ inputs.g1_public_key_sha256 }}
          G1_PEM_BASE64: ${{ secrets.GROWTHMAP_G1_PUBLIC_KEY_PEM_BASE64 }}
        run: |
          $key=Join-Path $env:RUNNER_TEMP 'growthmap-production-g1-public-key.pem'
          $config=Join-Path $env:RUNNER_TEMP 'growthmap-production-config/commercial-config.json'
          $mode=Join-Path $env:RUNNER_TEMP 'growthmap-production-config/release-mode.json'
          try { [IO.File]::WriteAllBytes($key,[Convert]::FromBase64String($env:G1_PEM_BASE64)) } catch { throw 'G1 public PEM secret is not valid base64' }
          $pem=[IO.File]::ReadAllText($key)
          if ($pem -notmatch '^-----BEGIN PUBLIC KEY-----' -or $pem -notmatch '-----END PUBLIC KEY-----\r?\n?$' -or $pem -match 'PRIVATE KEY') { throw 'Decoded G1 input must be public-only PEM' }
          if ((Get-FileHash $key -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:G1_PIN) { throw 'Decoded G1 public PEM differs from witnessed SHA-256 pin' }
          New-Item (Split-Path $mode) -ItemType Directory -Force | Out-Null
          [IO.File]::WriteAllText($mode,"{`n  `"schemaVersion`": 1,`n  `"mode`": `"unsigned-commercial`",`n  `"updatesEnabled`": false,`n  `"publisherDisplay`": `"Unknown Publisher — 月影塵（nerv00kaworu）`"`n}`n",[Text.UTF8Encoding]::new($false))
          "key=$key" >> $env:GITHUB_OUTPUT
          "config=$config" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_OUTPUT
      - name: Build exact unsigned commercial Windows package
        shell: pwsh
        env:
          GROWTHMAP_PRODUCTION_LICENSE_PUBLIC_KEY: ${{ steps.public-config.outputs.key }}
          GROWTHMAP_PRODUCTION_PUBLIC_CONFIG: ${{ steps.public-config.outputs.config }}
          GROWTHMAP_PRODUCTION_RELEASE_MODE: ${{ steps.public-config.outputs.mode }}
          GROWTHMAP_PRODUCTION_PUBLIC_KEY_SHA256: ${{ inputs.g1_public_key_sha256 }}
          GROWTHMAP_COMMERCIAL_RELEASE: ''
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $dirty=@(git status --porcelain=v1 --untracked-files=all -- . ':(exclude)desktop/dist')
          if ($LASTEXITCODE -ne 0 -or $dirty.Count) { throw "Source differs from final-verified bytes before package: $($dirty -join '; ')" }
          npm --prefix desktop run dist:win:production-unsigned
          if ($LASTEXITCODE -ne 0) { throw 'Production package failed' }
          $dirty=@(git status --porcelain=v1 --untracked-files=all -- . ':(exclude)desktop/dist')
          if ($LASTEXITCODE -ne 0 -or $dirty.Count) { throw "Packaging mutated or created source bytes: $($dirty -join '; ')" }
      - name: Assert production PowerShell runtime contract
        shell: pwsh
        run: |
          if ($PSVersionTable.PSEdition -cne 'Core' -or [Version]$PSVersionTable.PSVersion.ToString() -lt [Version]'7.4.0') { throw 'Production release chain requires PowerShell Core 7.4 or newer' }
          if (-not (Get-Command Start-Process).Parameters.ContainsKey('Environment')) { throw 'Required Start-Process -Environment capability is absent' }
          if (-not [IO.Path].GetMethod('GetRelativePath',[Type[]]@([string],[string]))) { throw 'Required Path.GetRelativePath capability is absent' }
      - name: Verify real main, exact public config, unsigned state and write hashes
        id: package-verification
        shell: pwsh
        run: ./.github/workflows/scripts/verify-production-unsigned-package.ps1 -ExpectedPin '${{ inputs.g1_public_key_sha256 }}' -SourceSha '${{ github.sha }}'
      - name: Exact final NSIS installed production acceptance
        shell: pwsh
        timeout-minutes: 10
        run: ./.github/workflows/scripts/installed-production-acceptance.ps1 -ManifestPath desktop/dist/growthmap-windows-production-personal-v1-manifest.json -ExpectedManifestSha256 '${{ steps.package-verification.outputs.manifest_sha256 }}' -ExpectedSourceSha '${{ github.sha }}'
      - name: Upload verifier diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: growthmap-windows-production-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/growthmap-production-asar-diagnostic.txt
            desktop/dist/win-unpacked/resources/app.asar
            desktop/artifacts/r39-renderer-e2e.log
            desktop/artifacts/growthmap-r39-renderer.png
            ${{ runner.temp }}/growthmap-installed-acceptance.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload installer and manifest hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: growthmap-windows-production-personal-v1-${{ inputs.release_label }}-${{ github.sha }}
          path: |
            desktop/dist/GrowthMap-Setup-*.exe
            desktop/dist/GrowthMap-Setup-*.exe.sha256
            desktop/dist/growthmap-windows-production-personal-v1-manifest.json
            desktop/dist/growthmap-windows-production-personal-v1-manifest.json.sha256
          if-no-files-found: error
          retention-days: 30
