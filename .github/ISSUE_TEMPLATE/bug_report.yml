name: Bug report
description: Report a reproducible product problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, activation/license codes, private keys, or project databases."
  - type: input
    id: version
    attributes: {label: App version}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected and actual behavior}
